<!doctype html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>wf · giriş</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<script src="/login.js" defer></script>
</head>
<body class="login">
<main class="login-card">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path class="logo-line" d="M7 16h18M16 7v18"/><polygon class="logo-ba" points="7,10 13,16 7,22 1,16"/><circle class="logo-dev" cx="16" cy="7" r="5"/><rect class="logo-rev" x="20" y="11" width="10" height="10" rx="2"/><polygon class="logo-qa" points="16,20 21,29 11,29"/></svg>
    <span class="brand-t">wf<span class="brand-dot">·</span>akış</span>
  </div>
  <h1>Panele giriş</h1>
  <p class="muted">Şefin ve agent'larının işini, maliyetini ve geçmişini izlemek için erişim token'ını gir.</p>
  <p id="err" class="err" role="alert" hidden></p>
  <form method="post" action="/login" class="login-form">
    <label for="token">Token</label>
    <input id="token" name="token" type="password" autocomplete="current-password" required autofocus spellcheck="false" autocapitalize="off">
    <button type="submit" class="primary">Giriş yap</button>
  </form>
  <ul class="login-roles" aria-hidden="true">
    <li class="c-ba"><svg viewBox="0 0 26 26"><polygon points="13,1 25,13 13,25 1,13"/></svg>Analiz</li>
    <li class="c-dev"><svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="12"/></svg>Dev</li>
    <li class="c-review"><svg viewBox="0 0 26 26"><rect x="2" y="2" width="22" height="22" rx="4"/></svg>Review</li>
    <li class="c-qa"><svg viewBox="0 0 26 26"><polygon points="13,1.5 25.5,24.5 0.5,24.5"/></svg>QA</li>
  </ul>
</main>
</body>
</html>
